name: Build Installers (EXE, DMG, DEB)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # --- 1. LINUX SETUP & BUILD ---
    - name: Install Linux Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ libglfw3-dev libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev file

    # --- 2. MACOS SETUP & BUILD ---
    - name: Install macOS Dependencies
      if: matrix.os == 'macos-latest'
      run: |
        brew update
        brew install cmake glfw create-dmg

    # --- 3. WINDOWS SETUP & BUILD ---
    - name: Install Windows Dependencies
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        # Install NSIS (required by CPack NSIS generator)
        choco install nsis -y

        # Download a real GLFW binary release for Windows (adjust version if needed)
        $url = 'https://github.com/glfw/glfw/releases/download/3.4.0/glfw-3.4.bin.WIN64.zip'
        Write-Host "Downloading $url"
        Invoke-WebRequest -Uri $url -OutFile glfw.zip

        Write-Host "Extracting glfw.zip"
        Expand-Archive -Path glfw.zip -DestinationPath C:\ -Force

        # Normalize the extracted path to C:\glfw
        if (Test-Path 'C:\glfw-3.4.bin.WIN64') {
          Remove-Item -Recurse -Force C:\glfw -ErrorAction SilentlyContinue
          Move-Item -Path 'C:\glfw-3.4.bin.WIN64' -Destination 'C:\glfw'
        } elseif (-not (Test-Path 'C:\glfw')) {
          Get-ChildItem C:\ | Out-String | Write-Host
          throw 'GLFW extraction failed - unexpected archive layout'
        }

        # Set environment variable for CMake to locate GLFW
        Add-Content -Path $env:GITHUB_ENV -Value 'glfw3_DIR=C:\\glfw\\lib-vc2022'
        Write-Host "glfw3_DIR set to C:\\glfw\\lib-vc2022"

    # --- 4. RUN CMAKE CONFIGURATION ---
    - name: Configure CMake
      run: |
        # Only pass -Dglfw3_DIR when it is set in the environment
        if [ -n "${GLFW3_DIR:-}" ]; then
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -Dglfw3_DIR="${GLFW3_DIR}"
        else
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release
        fi

    # --- 5. COMPILATION ---
    - name: Build Game
      run: cmake --build build --config Release

    # --- 6. PACKAGING STEP ---

    # Linux packaging outputs a .deb file
    - name: Package Linux (.deb)
      if: matrix.os == 'ubuntu-latest'
      run: |
        cd build
        cpack -G DEB

    # Windows packaging outputs an installer executable (.exe) via NSIS
    - name: Package Windows (.exe Installer)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        cd build
        cpack -G NSIS

    # Mac packaging manually creates an App structure and wraps it in a .dmg
    - name: Package macOS (.dmg)
      if: matrix.os == 'macos-latest'
      run: |
        mkdir -p build/TuxSlide.app/Contents/MacOS
        # The executable target name is 'tux_game' per CMakeLists.txt
        cp build/tux_game build/TuxSlide.app/Contents/MacOS/TuxSlide || cp build/Release/tux_game build/TuxSlide.app/Contents/MacOS/TuxSlide

        # Create a beautiful dmg installer container
        create-dmg \
          --volname "TuxSlide Installer" \
          --window-size 500 300 \
          --icon-size 100 \
          --icon "TuxSlide.app" 175 120 \
          --hide-extension "TuxSlide.app" \
          --app-drop-link 325 120 \
          build/TuxSlide.dmg \
          build/TuxSlide.app/

    # --- 7. UPLOAD THE RESULTING PACKAGES ---
    - name: Upload Installer Packages
      uses: actions/upload-artifact@v4
      with:
        name: installers-${{ matrix.os }}
        path: |
          build/*.deb
          build/*.exe
          build/*.dmg
